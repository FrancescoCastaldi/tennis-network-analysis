name: Bug or wrong number
description: The pipeline fails, or a result looks wrong
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: Command run, output or number observed
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and why
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD`
