name: PR check

# pull_request_target runs the workflow and the script from the base branch, so a pull request cannot
# change the check that judges it. Nothing from the pull request is checked out or executed: the
# checker only reads the title, the body, the labels, the assignees and the milestone, passed through
# environment variables.
on:
  pull_request_target:
    types:
      [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled, assigned, unassigned, milestoned, demilestoned]

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-body:
    name: Title and body follow the template
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check title and body
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_ASSIGNEES: ${{ toJSON(github.event.pull_request.assignees.*.login) }}
          PR_MILESTONE: ${{ github.event.pull_request.milestone.title }}
        run: python scripts/check_pr_body.py
