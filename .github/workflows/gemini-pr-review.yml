name: Gemini PR Reviewer

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened]

jobs:
  gemini_review:
    # Vincolo rigoroso: eseguibile ESCLUSIVAMENTE da FrancescoCastaldi
    # 1. Su commento /review: l'autore del commento deve essere FrancescoCastaldi
    # 2. Su apertura PR: l'autore della PR deve essere FrancescoCastaldi
    if: >
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/review') &&
       github.event.comment.user.login == 'FrancescoCastaldi') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.user.login == 'FrancescoCastaldi')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa librerie
        run: pip install requests

      - name: Esegui analisi con Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          TRIGGER_USER: ${{ github.event.comment.user.login || github.event.pull_request.user.login }}
        run: |
          python -c "
          import os, sys, requests

          # Controllo di sicurezza a doppio livello: whitelist tassativa
          trigger_user = os.environ.get('TRIGGER_USER', '')
          ALLOWED_USERS = ['FrancescoCastaldi']

          if trigger_user not in ALLOWED_USERS:
              print(f'Accesso negato: utente \"{trigger_user}\" non autorizzato a consumare quota Gemini.')
              sys.exit(0)

          repo = os.environ['REPO']
          pr_num = os.environ['PR_NUMBER']
          gh_token = os.environ['GITHUB_TOKEN']
          api_key = os.environ['GEMINI_API_KEY']

          # 1. Recupera il diff della PR
          diff_url = f'https://api.github.com/repos/{repo}/pulls/{pr_num}'
          headers = {
              'Authorization': f'token {gh_token}',
              'Accept': 'application/vnd.github.v3.diff'
          }
          res = requests.get(diff_url, headers=headers)
          diff = res.text[:80000]

          if not diff.strip():
              print('Nessun diff trovato da analizzare.')
              sys.exit(0)

          # 2. Richiesta a Gemini
          prompt = f'''Sei un Senior Principal Software Engineer e Lead Reviewer.
          Analizza il seguente diff di codice proveniente da una Pull Request:
          1. Sintesi del Cambiamento
          2. Problemi Critici e Bug Potenziali (eccezioni non gestite, edge cases, regressioni)
          3. Sicurezza e Robustezza (validazione input, memory leak, concurrency)
          4. Performance e Ottimizzazioni
          5. Copertura Test (mancanze e suggerimenti)
          6. Suggerimenti di Refactoring con codice dimostrativo
          7. Verdetto Finale (APPROVE / REQUEST_CHANGES / COMMENT)

          Diff:
          \`\`\`diff
          {diff}
          \`\`\`
          Rispondi in Markdown strutturato, tecnico e asciutto.'''

          models = ['gemini-3.5-flash', 'gemini-3.1-flash-lite', 'gemini-3.8-flash']
          review_text = None
          for m in models:
              url = f'https://generativelanguage.googleapis.com/v1beta/models/{m}:generateContent?key={api_key}'
              r = requests.post(url, json={'contents': [{'parts': [{'text': prompt}]}]}, timeout=60)
              if r.status_code == 200:
                  review_text = r.json()['candidates'][0]['content']['parts'][0]['text']
                  break

          if not review_text:
              print('Impossibile ottenere risposta da Gemini.')
              sys.exit(1)

          # 3. Posta commento
          comment_url = f'https://api.github.com/repos/{repo}/issues/{pr_num}/comments'
          payload = {'body': f'### 🤖 Gemini Code Review\n\n{review_text}'}
          requests.post(comment_url, headers={'Authorization': f'token {gh_token}'}, json=payload)
          print('Review pubblicata con successo!')
          "
