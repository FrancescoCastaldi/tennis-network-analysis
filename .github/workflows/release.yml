name: Release

# A release starts from an annotated tag `vX.Y.Z` on main, created with `python scripts/release.py tag`.
# The tag is verified against the changelog and the versions in the repository, the tests and the
# PDF build run again, and the GitHub release is published with notes, the report PDF, the results
# and their checksums. See "Releases" in AGENTS.md.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch the tags as they are on the remote
        run: git fetch --force --tags origin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag against the changelog and the versions
        run: python scripts/release.py check "$GITHUB_REF_NAME" --tag-exists

  test:
    name: Lint and test
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: python -m tennis_networks.wordcount report/main.tex

  report:
    name: Build report PDF
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: report
      - uses: actions/upload-artifact@v4
        with:
          name: report-pdf
          path: report/main.pdf
          retention-days: 7

  publish:
    name: Publish the release
    runs-on: ubuntu-latest
    needs: [test, report]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch the tags as they are on the remote
        run: git fetch --force --tags origin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the package (the notes count the words of the report)
        run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: report-pdf
          path: pdf
      - name: Collect the assets and their checksums
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir dist
          cp pdf/main.pdf "dist/report-v${version}.pdf"
          tar -czf "dist/results-v${version}.tar.gz" results report/tables report/figures
          (cd dist && sha256sum "report-v${version}.pdf" "results-v${version}.tar.gz" > SHA256SUMS.txt)
      - name: Write the release notes
        run: python scripts/release.py notes "$GITHUB_REF_NAME" --assets dist > notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$title" \
            --notes-file notes.md \
            --verify-tag \
            --latest
