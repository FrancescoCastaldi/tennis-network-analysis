[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-networks"
version = "0.2.7"
description = "Structural analysis of professional tennis match networks across eras, surfaces and tours (Network Analysis, University of Bologna)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "Jacopo Bonifazi" },
  { name = "Francesco Castaldi" },
  { name = "Paolo Fusco" },
  { name = "Shivam Kumar" },
  { name = "Gaetano Muscarello" },
]
dependencies = [
  "networkx>=3.4",
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "powerlaw>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pre-commit>=3.7", "pip-audit>=2.7"]
notebook = ["jupyterlab>=4", "ipykernel>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = ["data: needs the processed datasets in data/processed"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "PD", "SIM"]
# NPY002: the global seed is set on purpose for libraries that use the legacy generator.
# PD010: pivot is the clearer choice for one value per (network, statistic).
ignore = ["NPY002", "PD010"]

[tool.coverage.run]
source = ["tennis_networks"]
