<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="45%" stop-color="#0c1424"/>
      <stop offset="100%" stop-color="#08101e"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="tennis-lime" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="court-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="node-glow-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#a3e635" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-lime" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Pattern Background -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.5"/>
      <circle cx="40" cy="40" r="1" fill="#334155" fill-opacity="0.6"/>
    </pattern>

    <!-- Radial Glows -->
    <radialGradient id="court-glow" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#070b14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lime-glow" cx="65%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#070b14" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.85; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.08); }
    }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 800; letter-spacing: -0.5px; }
    .mono-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .sans-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="340" rx="18" fill="url(#bg-grad)"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid-pattern)"/>
  <rect width="1200" height="340" rx="18" fill="url(#court-glow)"/>
  <rect width="1200" height="340" rx="18" fill="url(#lime-glow)"/>
  <rect width="1200" height="340" rx="18" fill="none" stroke="url(#card-border)" stroke-width="1.5"/>

  <!-- ================= RIGHT SIDE: TENNIS NETWORK GRAPH & COURT ================= -->
  <g transform="translate(680, 20)">
    <!-- Stylized Perspective Tennis Court Wireframe -->
    <g opacity="0.25" stroke="#38bdf8" stroke-width="1" fill="none">
      <!-- Court Outer Boundary (Isometric Tilt) -->
      <polygon points="120,270 420,270 470,120 170,120"/>
      <!-- Singles Sidelines -->
      <line x1="160" y1="270" x2="210" y2="120"/>
      <line x1="380" y1="270" x2="430" y2="120"/>
      <!-- Net Line -->
      <line x1="145" y1="195" x2="445" y2="195" stroke="#a3e635" stroke-width="1.8" opacity="0.6"/>
      <!-- Service Boxes -->
      <line x1="180" y1="160" x2="420" y2="160"/>
      <line x1="170" y1="230" x2="410" y2="230"/>
      <!-- Center Service Line -->
      <line x1="295" y1="160" x2="295" y2="230"/>
    </g>

    <!-- Network Edges (Directed Arcs) -->
    <!-- Arc: Federer -> Nadal -->
    <path d="M 230,150 Q 285,115 340,165" fill="none" stroke="#38bdf8" stroke-width="2.2" opacity="0.75" filter="url(#glow-subtle)"/>
    <!-- Arc: Djokovic -> Federer -->
    <path d="M 270,95 Q 235,115 230,150" fill="none" stroke="#a3e635" stroke-width="2.4" opacity="0.8" filter="url(#glow-subtle)"/>
    <!-- Arc: Djokovic -> Nadal -->
    <path d="M 270,95 Q 320,110 340,165" fill="none" stroke="#38bdf8" stroke-width="2.6" opacity="0.85"/>
    <!-- Arc: Murray -> Big Three -->
    <path d="M 180,95 Q 220,85 270,95" fill="none" stroke="#94a3b8" stroke-width="1.6" opacity="0.6" stroke-dasharray="3,3"/>
    <path d="M 180,95 Q 195,130 230,150" fill="none" stroke="#94a3b8" stroke-width="1.6" opacity="0.6"/>

    <!-- Arc: Next Gen / Recent Era (Alcaraz, Sinner, Medvedev) -->
    <path d="M 370,80 Q 320,75 270,95" fill="none" stroke="#facc15" stroke-width="1.8" opacity="0.7"/>
    <path d="M 370,80 Q 405,115 420,160" fill="none" stroke="#facc15" stroke-width="2" opacity="0.75"/>
    <path d="M 420,160 Q 390,175 340,165" fill="none" stroke="#f43f5e" stroke-width="1.8" opacity="0.7"/>
    <path d="M 380,230 Q 410,205 420,160" fill="none" stroke="#38bdf8" stroke-width="1.6" opacity="0.65"/>
    <path d="M 380,230 Q 355,195 340,165" fill="none" stroke="#10b981" stroke-width="2" opacity="0.75"/>

    <!-- Arc: WTA Elite Cluster (Serena, Swiatek, Sabalenka) -->
    <path d="M 140,225 Q 180,195 230,220" fill="none" stroke="#ec4899" stroke-width="2" opacity="0.75"/>
    <path d="M 230,220 Q 285,250 310,240" fill="none" stroke="#ec4899" stroke-width="2.2" opacity="0.8"/>
    <path d="M 140,225 Q 220,265 310,240" fill="none" stroke="#a855f7" stroke-width="1.6" opacity="0.6"/>
    <!-- Peripheral / Clay / Grass links -->
    <path d="M 80,160 Q 130,155 180,95" fill="none" stroke="#64748b" stroke-width="1.2" opacity="0.45"/>
    <path d="M 80,160 Q 155,155 230,150" fill="none" stroke="#64748b" stroke-width="1.2" opacity="0.45"/>
    <path d="M 230,220 Q 230,185 230,150" fill="none" stroke="#cbd5e1" stroke-width="1" opacity="0.35" stroke-dasharray="2,2"/>
    <path d="M 455,230 Q 425,235 380,230" fill="none" stroke="#64748b" stroke-width="1.2" opacity="0.5"/>

    <!-- Glowing Network Nodes -->
    <!-- Peripheral Nodes -->
    <circle cx="80" cy="160" r="5" fill="#475569" stroke="#94a3b8" stroke-width="1.5" opacity="0.7"/>
    <circle cx="180" cy="95" r="7" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="180" y="80" fill="#94a3b8" font-size="10" text-anchor="middle" class="sans-text">Murray</text>

    <!-- Node: Serena Williams (WTA Hub) -->
    <circle cx="140" cy="225" r="8" fill="#831843" stroke="#f472b6" stroke-width="2.5" filter="url(#glow-subtle)"/>
    <text x="140" y="247" fill="#f472b6" font-size="11" font-weight="600" text-anchor="middle" class="sans-text">S. Williams</text>

    <!-- Node: Swiatek -->
    <circle cx="230" cy="220" r="8" fill="#500724" stroke="#ec4899" stroke-width="2.2"/>
    <text x="230" y="206" fill="#fbcfe8" font-size="10" text-anchor="middle" class="sans-text">Swiatek</text>

    <!-- Node: Sabalenka -->
    <circle cx="310" cy="240" r="7" fill="#3b0764" stroke="#c084fc" stroke-width="2"/>
    <text x="310" y="260" fill="#e9d5ff" font-size="10" text-anchor="middle" class="sans-text">Sabalenka</text>

    <!-- THE BIG THREE CORE (Rich-Club / Maximum PageRank) -->
    <!-- Node: Federer -->
    <circle cx="230" cy="150" r="12" fill="#0f172a" stroke="#38bdf8" stroke-width="3" filter="url(#glow-cyan)"/>
    <circle cx="230" cy="150" r="4.5" fill="#38bdf8"/>
    <text x="230" y="174" fill="#bae6fd" font-size="12" font-weight="700" text-anchor="middle" class="sans-text">Federer</text>

    <!-- Node: Nadal -->
    <circle cx="340" cy="165" r="13" fill="#0f172a" stroke="#ea580c" stroke-width="3" filter="url(#glow-subtle)"/>
    <circle cx="340" cy="165" r="5" fill="#f97316"/>
    <text x="340" y="190" fill="#fed7aa" font-size="12" font-weight="700" text-anchor="middle" class="sans-text">Nadal</text>

    <!-- Node: Djokovic -->
    <circle cx="270" cy="95" r="14" fill="#0f172a" stroke="#a3e635" stroke-width="3.5" filter="url(#glow-lime)"/>
    <circle cx="270" cy="95" r="5.5" fill="#a3e635"/>
    <text x="270" y="74" fill="#d9f99d" font-size="13" font-weight="800" text-anchor="middle" class="sans-text">Djokovic</text>

    <!-- Node: Alcaraz -->
    <circle cx="370" cy="80" r="9" fill="#1e1b4b" stroke="#facc15" stroke-width="2.5"/>
    <circle cx="370" cy="80" r="3.5" fill="#fde047"/>
    <text x="370" y="64" fill="#fef08a" font-size="11" font-weight="600" text-anchor="middle" class="sans-text">Alcaraz</text>

    <!-- Node: Sinner -->
    <circle cx="420" cy="160" r="9" fill="#1e1b4b" stroke="#f97316" stroke-width="2.5"/>
    <circle cx="420" cy="160" r="3.5" fill="#fb923c"/>
    <text x="456" y="164" fill="#ffedd5" font-size="11" font-weight="600" text-anchor="start" class="sans-text">Sinner</text>

    <!-- Node: Medvedev -->
    <circle cx="380" cy="230" r="7" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
    <text x="380" y="250" fill="#a5f3fc" font-size="10" text-anchor="middle" class="sans-text">Medvedev</text>

    <circle cx="455" cy="230" r="5" fill="#1e293b" stroke="#64748b" stroke-width="1.5" opacity="0.6"/>

    <!-- Tennis Ball Trajectory Arc -->
    <path d="M 120,60 Q 280,10 460,110" fill="none" stroke="url(#tennis-lime)" stroke-width="2" stroke-linecap="round" opacity="0.75" filter="url(#glow-lime)"/>
    <!-- Tennis Ball Graphic with Seam -->
    <g transform="translate(460, 110)">
      <circle cx="0" cy="0" r="11" fill="#ccff00" filter="url(#glow-lime)"/>
      <path d="M -8,-6 C -2,-4 -2,4 -8,6" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
      <path d="M 8,-6 C 2,-4 2,4 8,6" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
    </g>
  </g>

  <!-- ================= LEFT SIDE: TITLE, CONTEXT, STATS ================= -->
  <g transform="translate(60, 42)">
    <!-- UniBo Header Badge -->
    <g>
      <rect width="365" height="28" rx="14" fill="#0f1f38" stroke="#1e3a5f" stroke-width="1.2"/>
      <circle cx="16" cy="14" r="5" fill="#a3e635" filter="url(#glow-subtle)"/>
      <text x="30" y="18" fill="#93c5fd" font-size="11" font-weight="600" class="sans-text" letter-spacing="0.6">
        ALMA MATER STUDIORUM · UNIVERSITÀ DI BOLOGNA
      </text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 72)">
      <text class="title-text" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="-0.8">
        TENNIS NETWORK
      </text>
      <text class="title-text" font-size="38" font-weight="900" x="390" fill="url(#tennis-lime)" letter-spacing="-0.8">
        ANALYSIS
      </text>
    </g>

    <!-- Subtitle / Research scope -->
    <g transform="translate(0, 106)">
      <text fill="#cbd5e1" font-size="15" font-weight="400" class="sans-text">
        Graph Mining, Eras, Surface Dynamics &amp; Competitive Balance in ATP &amp; WTA
      </text>
      <text fill="#64748b" font-size="12.5" font-weight="400" y="22" class="sans-text">
        Course of Network Analysis · Master's Degree in Computer Science · A.Y. 2026/2027
      </text>
    </g>

    <!-- Divider Line -->
    <line x1="0" y1="150" x2="570" y2="150" stroke="#1e293b" stroke-width="1.2"/>

    <!-- Key Metrics Cards / Badges -->
    <g transform="translate(0, 168)">
      <!-- Metric 1: Networks -->
      <g transform="translate(0, 0)">
        <rect width="130" height="66" rx="10" fill="#0c1526" stroke="#1e293b" stroke-width="1.2"/>
        <text x="14" y="28" fill="#38bdf8" font-size="20" font-weight="800" class="mono-text">13</text>
        <text x="14" y="44" fill="#94a3b8" font-size="10.5" font-weight="600" class="sans-text">NETWORKS</text>
        <text x="14" y="56" fill="#64748b" font-size="9" class="sans-text">4 Michieli · 9 Era/Tour</text>
      </g>

      <!-- Metric 2: Matches -->
      <g transform="translate(142, 0)">
        <rect width="130" height="66" rx="10" fill="#0c1526" stroke="#1e293b" stroke-width="1.2"/>
        <text x="14" y="28" fill="#a3e635" font-size="20" font-weight="800" class="mono-text">114k+</text>
        <text x="14" y="44" fill="#94a3b8" font-size="10.5" font-weight="600" class="sans-text">MATCHES</text>
        <text x="14" y="56" fill="#64748b" font-size="9" class="sans-text">2000–2025 ATP &amp; WTA</text>
      </g>

      <!-- Metric 3: Hypotheses -->
      <g transform="translate(284, 0)">
        <rect width="130" height="66" rx="10" fill="#0c1526" stroke="#1e293b" stroke-width="1.2"/>
        <text x="14" y="28" fill="#facc15" font-size="20" font-weight="800" class="mono-text">H1–H8</text>
        <text x="14" y="44" fill="#94a3b8" font-size="10.5" font-weight="600" class="sans-text">HYPOTHESES</text>
        <text x="14" y="56" fill="#64748b" font-size="9" class="sans-text">Null Models &amp; QAP</text>
      </g>

      <!-- Metric 4: Test Suite -->
      <g transform="translate(426, 0)">
        <rect width="136" height="66" rx="10" fill="#0c1526" stroke="#1e293b" stroke-width="1.2"/>
        <text x="14" y="28" fill="#10b981" font-size="20" font-weight="800" class="mono-text">178/178</text>
        <text x="14" y="44" fill="#94a3b8" font-size="10.5" font-weight="600" class="sans-text">TESTS PASSING</text>
        <text x="14" y="56" fill="#64748b" font-size="9" class="sans-text">100% Deterministic</text>
      </g>
    </g>

    <!-- Bottom Feature Tags -->
    <g transform="translate(0, 252)">
      <g transform="translate(0, 0)">
        <rect width="90" height="22" rx="6" fill="#1e293b" fill-opacity="0.7"/>
        <text x="45" y="15" fill="#94a3b8" font-size="10" font-weight="600" text-anchor="middle" class="mono-text">PageRank</text>
      </g>
      <g transform="translate(98, 0)">
        <rect width="90" height="22" rx="6" fill="#1e293b" fill-opacity="0.7"/>
        <text x="45" y="15" fill="#94a3b8" font-size="10" font-weight="600" text-anchor="middle" class="mono-text">Rich-Club</text>
      </g>
      <g transform="translate(196, 0)">
        <rect width="98" height="22" rx="6" fill="#1e293b" fill-opacity="0.7"/>
        <text x="49" y="15" fill="#94a3b8" font-size="10" font-weight="600" text-anchor="middle" class="mono-text">Triad Census</text>
      </g>
      <g transform="translate(302, 0)">
        <rect width="102" height="22" rx="6" fill="#1e293b" fill-opacity="0.7"/>
        <text x="51" y="15" fill="#94a3b8" font-size="10" font-weight="600" text-anchor="middle" class="mono-text">Powerlaw ML</text>
      </g>
      <g transform="translate(412, 0)">
        <rect width="115" height="22" rx="6" fill="#1e293b" fill-opacity="0.7"/>
        <text x="57" y="15" fill="#94a3b8" font-size="10" font-weight="600" text-anchor="middle" class="mono-text">QAP Regression</text>
      </g>
      <g transform="translate(535, 0)">
        <rect width="82" height="22" rx="6" fill="#1e293b" fill-opacity="0.7"/>
        <text x="41" y="15" fill="#a3e635" font-size="10" font-weight="600" text-anchor="middle" class="mono-text">seed: 20261115</text>
      </g>
    </g>
  </g>
</svg>
